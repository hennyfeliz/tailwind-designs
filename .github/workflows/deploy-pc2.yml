name: Deploy Music Player to PC2

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: SHA of the locally reviewed commit approved for PC2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pc2-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.reviewed_commit == github.sha && github.ref == 'refs/heads/codex/pc2-deploy'
    runs-on: [self-hosted, Windows, X64, pc2-docker]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_commit }}

      - name: Assert reviewed commit
        shell: pwsh
        run: |
          $expected = '${{ inputs.reviewed_commit }}'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "Checkout $actual does not match reviewed commit $expected"
          }

      - name: Verify shared deployer
        shell: pwsh
        run: |
          $engineRoot = 'C:\Deploy\pc2-deployer'
          $engine = 'C:\Deploy\pc2-deployer\scripts\deploy.ps1'
          if (-not (Test-Path -LiteralPath (Join-Path $engineRoot '.git') -PathType Container)) {
            throw "No se encontro el repositorio del motor generico en $engineRoot"
          }

          git -C $engineRoot pull --ff-only
          if ($LASTEXITCODE -ne 0) {
            throw "No se pudo actualizar el motor generico con fast-forward"
          }

          if (-not (Test-Path -LiteralPath $engine -PathType Leaf)) {
            throw "No se encontro el motor generico en $engine"
          }

      - name: Deploy Docker Compose service
        shell: pwsh
        run: |
          $engine = 'C:\Deploy\pc2-deployer\scripts\deploy.ps1'
          $manifest = Join-Path $env:GITHUB_WORKSPACE '.pc2\deploy.json'

          & $engine `
            -ManifestPath $manifest `
            -WorkspaceRoot $env:GITHUB_WORKSPACE

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
